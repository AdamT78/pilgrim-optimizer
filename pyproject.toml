[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pilgrim-optimizer"
version = "0.1.0"
description = "Deterministic rules engine and optimization framework scaffold for Pilgrim."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  # numpy is not optional and never was: tools/ui_debug/sculpt_metrics.py imports it at module
  # level, and everything that measures a sculpt or a plate imports that. It was undeclared and
  # only installed by hand in the `ui` CI lane -- a lane gated on paths under ui/, so a change to
  # tools/ or tests/ never ran it. The first test to import the measuring errored in the fast
  # lane instead, with a ModuleNotFoundError that looked like a code bug.
  "numpy",
  "pillow",
  "playwright",
  # The asset checker degrades without scipy -- it simply stops offering the background estimate
  # for a screenshot that arrived with no alpha. The TEST of that estimate cannot degrade: it
  # asserts the estimate lands within a couple of degrees of the truth, and with scipy absent it
  # fails rather than skips. Declared so the guard actually guards.
  "scipy",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["pilgrim*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: expensive tests excluded by pytest -m \"not slow\"",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
