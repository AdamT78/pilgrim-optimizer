<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 141" width="130" height="141">
  <title>Banner on a rod</title>
  <defs>
    <!-- The art is defined ONCE and drawn twice: fat-stroked underneath, filled on top. A stroke
         is centred on its path, so overpainting with the fills eats the inner half and leaves a
         clean outline of the UNION -- no seams where the rod crosses the cloth, and the slots
         still get outlined because they are holes in the same path. -->
    <g id="art">
      <!-- The cloth: straight sides to y 97, then a true semicircle of r 37. Traced, not guessed
           -- the source's bottom fits a circle centred 64,97 to within a pixel the whole way
           down. The three slots are cut with evenodd; each opens at the top edge and closes on a
           semicircle of its own half-width, which is what makes the tabs read as loops. -->
      <path fill-rule="evenodd" d="M27 8 H101 V97 A37 37 0 0 1 27 97 Z
        M36.75 8 V15.5 A5.5 5.5 0 0 0 47.75 15.5 V8 Z
        M58.5 8 V15.5 A5.5 5.5 0 0 0 69.5 15.5 V8 Z
        M80.25 8 V15.5 A5.5 5.5 0 0 0 91.25 15.5 V8 Z"/>
      <!-- The rod crosses in FRONT of the slots -- that is what splits each one into a gap above
           and a rounded gap below, and reads as cloth looped over a pole. It runs between the two
           finial centres; the spearheads carry it out to the full width. -->
      <rect x="13.4" y="9.75" width="100.2" height="3.5" rx="1.75"/>
      <!-- Each end is a spearhead and a collar, mirrored about x 63.5 (so the tips land on 5 and
           122, the source's own extremes). -->
      <path d="M5 11.5 L13.2 6.9 L17.5 9.2 V13.8 L13.2 16.1 Z"/>
      <rect x="18.8" y="8.2" width="3.6" height="6.6" rx="1.2"/>
      <path d="M122 11.5 L113.8 6.9 L109.5 9.2 V13.8 L113.8 16.1 Z"/>
      <rect x="104.6" y="8.2" width="3.6" height="6.6" rx="1.2"/>
    </g>
  </defs>
  <use href="#art" fill="#3B6EA5" stroke="#000" stroke-width="3"
       stroke-linejoin="round" stroke-linecap="round"/>
  <use href="#art" fill="#3B6EA5"/>
</svg>
