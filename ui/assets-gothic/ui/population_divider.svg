<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 170" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bar" x1="18" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2a19" stop-opacity="0.78"/>
      <stop offset="0.20" stop-color="#6e5a3d" stop-opacity="0.82"/>
      <stop offset="0.50" stop-color="#9b8767" stop-opacity="0.72"/>
      <stop offset="0.78" stop-color="#5a462e" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#2e2113" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="softInsetShadow" x="-80%" y="-8%" width="260%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="blur"/>
      <feOffset dx="0.9" dy="0.3" result="off"/>
      <feFlood flood-color="#1e140a" flood-opacity="0.40"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Single integrated divider bar. -->
  <rect x="21.15" y="48" width="5.7" height="100" rx="2.85"
        fill="url(#bar)" filter="url(#softInsetShadow)"/>

  <!-- Narrow bevel highlights, deliberately subtle. -->
  <path d="M23.15 51 V145"
        stroke="#d6c29b" stroke-width="0.95" stroke-linecap="round" opacity="0.38"/>
  <path d="M25.85 51 V145"
        stroke="#24180d" stroke-width="0.95" stroke-linecap="round" opacity="0.32"/>
</svg>
