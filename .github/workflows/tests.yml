name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.what.outputs.engine }}
      ui: ${{ steps.what.outputs.ui }}
      lab: ${{ steps.what.outputs.lab }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: what
        name: Decide which lanes this change needs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request runs everything. A push to main is the last line
          # of defence and is not the place to be clever, and workflow_dispatch is someone asking
          # for a full run by hand.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "engine=true" >>"$GITHUB_OUTPUT"
            echo "ui=true" >>"$GITHUB_OUTPUT"
            echo "lab=true" >>"$GITHUB_OUTPUT"
            echo "not a pull request: running every lane"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          # The engine lanes are needed unless EVERY changed path is design-only. Framed as
          # "nothing outside these directories" rather than "something inside them", so a new
          # top-level directory is treated as engine work until someone decides otherwise --
          # the failure that costs fifteen minutes is cheaper than the one that ships a bug.
          #
          # tests/layout_lab/, tests/action_board/ and tests/icon_lab/ are design-only despite
          # living under tests/. They hold board_v2's guards, plus the mutation and browser
          # acceptance suites left over from the layout lab; pilgrim/ imports nothing from ui/ at
          # all, so no change in there can reach the engine. All three are listed in the lab
          # condition below as well, because a path that stops triggering the engine lanes must
          # start triggering something.
          #
          # tests/icon_lab/ WAS MISSING HERE for one PR, and that is what this comment is for.
          # It was added to the lab condition the day the directory arrived and not to this one,
          # so every icon-lab change -- the most frequent kind of change this tree gets -- ran the
          # whole engine suite to prove nothing about a tree the engine cannot import. The two
          # lists have to agree, and tests/test_ci_router.py now asserts that they do, because
          # reading them side by side in a shell pipeline is exactly how this was missed.
          #
          # tools/duty_art/ is the same case one directory over: a crop script for the duty
          # action illustrations, importing pillow and nothing from pilgrim/, and already tested
          # by tests/layout_lab/test_duty_art_crop.py. It triggers the lab lane below.
          #
          # .gitignore is the one path here that triggers NOTHING, and deliberately. It cannot
          # change what any test does -- CI checks out a clean tree, where an ignore rule has
          # nothing to ignore -- so there is no lane for it to start triggering. Everything else
          # that stops waking the engine has to wake something.
          #
          # .github/ AND tests/test_ci_router.py USED TO FORCE THE FULL SUITE, and that rule has
          # been retired. It was written before the router had a test: changing the router was the
          # moment to make everything prove itself, because nothing else could. The reasoning does
          # not survive the arithmetic. A router change is an edit to a grep pattern in a shell
          # script; it cannot alter a line of pilgrim/, so running 2,739 engine tests proved
          # nothing about it and cost fourteen minutes to prove it. What actually needs checking
          # when the router changes is the ROUTER, and tests/test_ci_router.py does that in 0.03
          # seconds -- it reads the lane conditions out of this file and asserts the two that have
          # to agree do agree, and that every test directory on disk wakes something.
          #
          # So .github/ now wakes the lab lane, which runs that guard. The thing that could go
          # wrong here is a path silently losing its lane, and the guard is pointed straight at
          # it; the engine suite never was.
          if echo "$changed" | grep -qvE '^(ui/|docs/|tests/layout_lab/|tests/action_board/|tests/icon_lab/|tests/test_ci_router\.py$|tools/duty_art/|\.github/|\.gitignore$)'; then
            echo "engine=true" >>"$GITHUB_OUTPUT"
          else
            echo "engine=false" >>"$GITHUB_OUTPUT"
            echo "design-only change: skipping the engine lanes"
          fi
          # The UI lane is the gothic tree, the page rebuilds and the asset licences. It drives
          # a browser, so it is the expensive one, and ui/board_v2/ needs none of it: no page in
          # rebuild_ui_pages.py comes from there (duty-border-studio.html is built by
          # ui/render/gen_border_studio.py), and its assets are not in the trees verify_assets.py
          # walks. So board_v2 is excluded here and answered by the lab lane instead.
          if echo "$changed" | grep -E '^ui/' | grep -qvE '^ui/board_v2/'; then
            echo "ui=true" >>"$GITHUB_OUTPUT"
          else
            echo "ui=false" >>"$GITHUB_OUTPUT"
          fi
          # The layout lab: its generator and template, the suites that test them, the duty
          # action art under ui/board_v2/duty_actions/, which is where the generated masters and
          # crops live, the icon lab's guards under tests/icon_lab/, and the crop script itself
          # under tools/duty_art/. EVERY TEST DIRECTORY THIS LANE RUNS HAS TO BE IN THIS PATTERN
          # TOO, or a change to the guards alone skips the lane that exists to run them. Nothing here imports
          # playwright, so this lane installs no browser and takes seconds -- which matters most
          # for the art, since adding a duty's pair is a frequent commit that has nothing to say
          # to the engine.
          #
          # .github/ IS HERE BECAUSE IT STOPPED WAKING THE ENGINE, which is the rule this file
          # already states: a path that stops triggering something has to start triggering
          # something else. The lab lane is where tests/test_ci_router.py runs, so a router change
          # now wakes the test written to check routers.
          if echo "$changed" | grep -qE '^(ui/board_v2/|tests/layout_lab/|tests/action_board/|tests/icon_lab/|tests/test_ci_router\.py$|tools/duty_art/|\.github/)'; then
            echo "lab=true" >>"$GITHUB_OUTPUT"
          else
            echo "lab=false" >>"$GITHUB_OUTPUT"
          fi

  ui:
    # What the engine lanes never checked: that the generators still produce their pages, and
    # that every asset still has a licence on record. Both are seconds, and until now nothing in
    # CI ran them at all.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.ui == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # pillow and numpy used to be installed by hand here. They are in the dev extras now, which
      # is where the fast lane picks them up too -- installing them only here is what let an
      # undeclared dependency sit unnoticed until a test outside ui/ imported the measuring.
      - name: Install what the UI checks need
        if: needs.changes.outputs.ui == 'true'
        run: pip install -e ".[dev]"
      - name: Every generated page still rebuilds, and none is a fossil
        if: needs.changes.outputs.ui == 'true'
        run: python ui/rebuild_ui_pages.py --check
      - name: Every asset matches its declared box and has a licence on record
        if: needs.changes.outputs.ui == 'true'
        working-directory: ui/assets
        run: |
          python verify_assets.py
          python gen_credits.py --check
      # The gothic tree keeps its own attribution.json and had nothing running against it, which
      # is the tree where the licences actually bite: portraits that may never be committed, an
      # icon whose attribution has to ship with the game. It has no assets.json -- its art is not
      # placed by ink box -- so only the records are checked, and the verifier says so.
      - name: The gothic tree has a record for every asset
        if: needs.changes.outputs.ui == 'true'
        run: python ui/assets/verify_assets.py --root ui/assets-gothic
      - uses: actions/cache@v4
        if: needs.changes.outputs.ui == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - name: Install the browser the picker guards drive
        if: needs.changes.outputs.ui == 'true'
        run: python -m playwright install --with-deps chromium
      - name: The gothic board and picker still agree with themselves
        # Named here as well as living in tests/, and that is the point: the fast lane is gated on
        # engine changes, so a design-only pull request -- exactly the kind that touches these
        # files -- would never run them otherwise.
        if: needs.changes.outputs.ui == 'true'
        run: |
          pytest tests/test_gothic_seat_coherence.py tests/test_gothic_picker_controls.py \
            tests/test_gothic_asset_guards.py tests/test_gothic_resource_boxes.py \
            tests/test_gothic_population_rows.py \
            tests/test_duty_wheel_guards.py tests/test_ground_guards.py -q

  lab:
    # The duty wheel layout lab, and deliberately nothing else. These guards read the generator
    # and the template as text and import no browser, so this lane skips the Playwright install
    # and the apt step that go with it -- which is the whole reason it is not part of the ui
    # lane. Seconds rather than minutes.
    #
    # It exists at all because the layout lab used to have no lane: the ui lane never named it,
    # and rebuild_ui_pages.py does not build it, so its guards only ran when a pull request
    # happened to touch the engine as well.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.lab == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.lab == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # NOT the dev extras. Most of these guards read the generator and the template as text,
      # and pilgrim itself is pure stdlib, so numpy, scipy and playwright are three large wheels
      # this lane would fetch and never import.
      #
      # PILLOW IS THE EXCEPTION, and it was missed when the duty-art guards arrived:
      # test_duty_art_crop.py runs the crop script, which opens images. It is installed rather
      # than skipped around. Three of those guards used importorskip and had therefore been
      # quietly skipping in CI ever since -- so this lane could be cited as the thing that covers
      # tools/duty_art/ while in fact running almost none of it, and a skip is green.
      #
      # NUMPY IS THE SECOND EXCEPTION, added when crop_duty_master.py learned to match tint.
      # That transform converts to CIELAB and back over a megapixel, which is array arithmetic
      # and nothing else. It is imported at module level, so without numpy this lane does not
      # skip a guard -- it fails collection and takes all of tests/layout_lab with it, which is
      # how the pillow omission above announced itself too.
      #
      # scikit-image would have supplied rgb2lab and was measured rather than assumed: 270 MB
      # and ten seconds against numpy's 72 MB and three, and it arrives with scipy, imageio,
      # tifffile, networkx and lazy-loader -- the exact wheels the paragraph above exists to
      # keep out. Twenty lines of published colour arithmetic, tested against scikit-image for
      # agreement and for an exact round trip, is the cheaper side of that trade.
      #
      # The editable install is still needed because tests/conftest.py imports pilgrim at
      # collection time.
      - if: needs.changes.outputs.lab == 'true'
        run: pip install -e . "pytest>=8.0.0" pillow numpy
      # BOTH DIRECTORIES, AND tests/action_board/ IS THE ONE THAT WAS MISSING. This lane is cited
      # as what covers ui/board_v2/, and it ran tests/layout_lab/ alone -- so the 38 guards on
      # geometry.py and the action board, the module that actually ships, never ran in CI. Three
      # commits that changed nothing but ui/board_v2/, tools/duty_art/ and tests/layout_lab/ were
      # design-only by the gate above, so the engine lanes that would have swept them up were
      # skipped, and this lane did not look. A lane named for a directory it does not run is worse
      # than no lane: it is green and it is cited.
      # THREE DIRECTORIES NOW, and the list above has to grow with this one. tests/icon_lab/
      # guards ui/board_v2/icon_lab/, which decides how a cut-out icon is framed and what the
      # board therefore draws -- so it belongs in the lane named for board_v2 rather than
      # nowhere. The warning in the paragraph below is the reason this is being written down a
      # second time: a lane named for a directory it does not run is green and it is cited.
      - name: board_v2 still holds its own invariants
        if: needs.changes.outputs.lab == 'true'
        run: pytest tests/action_board/ tests/icon_lab/ tests/layout_lab/ tests/test_ci_router.py -q

  fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.engine == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # TWO INSTALLS, because this job has two audiences. The lint below runs on every change
      # and needs ruff alone; the engine tests further down need the lot. Installing `dev`
      # unconditionally meant an artwork-only pull request sat through numpy, scipy, pillow and
      # playwright -- tens of megabytes of wheels, none of them imported -- to reach a linter that
      # finishes in seconds. That was the largest remaining cost on a board_v2 change.
      - run: pip install -e ".[lint]"
      - if: needs.changes.outputs.engine == 'true'
        run: pip install -e ".[dev]"
      # Deliberately narrow: undefined/shadowed names must gate, while existing E501s do not.
      # This one runs on EVERY change, design-only included: it is repo-wide, it takes seconds,
      # and it is exactly what caught fourteen undefined-name errors in ui/ the day that tree
      # arrived. Skipping it for design changes would skip it on the least-linted code there is.
      #
      # W605 joined F because this tree writes JavaScript inside Python strings, and a regex like
      # /\s+/ in a non-raw one is an invalid Python escape that Python passes through anyway. It
      # works, warns on 3.10 and warns louder on the 3.13 this lane runs, and it is the kind of
      # thing nobody fixes because nothing fails. Two of them had been carried for four pull
      # requests when this was added.
      - run: ruff check --select F,W605
      - name: Require Node.js for turn-script harness tests
        if: needs.changes.outputs.engine == 'true'
        run: |
          if ! command -v node >/dev/null; then
            echo "::error::Node.js is required for the turn-script harness tests."
            exit 1
          fi
          node --version
      - if: needs.changes.outputs.engine == 'true'
        run: pytest -m "not slow" --ignore=tests/test_play_view_clicks.py

  slow:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.engine == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.engine == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: needs.changes.outputs.engine == 'true'
        run: pip install -e ".[dev]"
      - name: Run deep-fixture slow guards
        if: needs.changes.outputs.engine == 'true'
        run: pytest -m slow -p no:cacheprovider --ignore=tests/test_play_view_clicks.py

  browser:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.engine == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.engine == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: needs.changes.outputs.engine == 'true'
        run: pip install -e ".[dev]"
      - name: Use the canonical Ubuntu mirror
        if: needs.changes.outputs.engine == 'true'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
      - uses: actions/cache@v4
        if: needs.changes.outputs.engine == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - if: needs.changes.outputs.engine == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run browser click guards
        if: needs.changes.outputs.engine == 'true'
        run: pytest -q -p no:cacheprovider tests/test_play_view_clicks.py

  generation-report:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package for generation captures
        run: pip install -e .
      - name: Detect capture-tooling changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            tools/capture_legal_actions.py tools/capture_turn_steps.py; then
            echo "CAPTURE_TOOLING_CHANGED=false" >>"$GITHUB_ENV"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "CAPTURE_TOOLING_CHANGED=true" >>"$GITHUB_ENV"
          fi
      - name: Capture base generation
        env:
          REVISION: ${{ github.event.pull_request.base.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/generation-base
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/generation-report-start"
          git checkout --detach "$REVISION"
          python tools/capture_legal_actions.py "$OUTPUT_DIR/actions"
          python tools/capture_turn_steps.py "$OUTPUT_DIR/turn-steps"
      - name: Capture head generation
        env:
          REVISION: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/generation-head
        run: |
          set -euo pipefail
          git checkout --detach "$REVISION"
          python tools/capture_legal_actions.py "$OUTPUT_DIR/actions"
          python tools/capture_turn_steps.py "$OUTPUT_DIR/turn-steps"
      - name: Report generated-output changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_DIR: ${{ runner.temp }}/generation-base
          HEAD_DIR: ${{ runner.temp }}/generation-head
        run: |
          set -euo pipefail
          started=$(cat "$RUNNER_TEMP/generation-report-start")
          export LC_ALL=C
          DIFF_BODY_BYTE_BUDGET=400000

          report_diff() {
            local label="$1"
            local base_dir="$2"
            local head_dir="$3"
            local diff_file="$RUNNER_TEMP/${label}.diff"
            local listing_file="$RUNNER_TEMP/${label}.files"
            local body_file="$RUNNER_TEMP/${label}.body"
            local counts_file="$RUNNER_TEMP/${label}.counts"
            local differing_files=0
            local file_word="files"
            local total_lines=0
            local shown_lines=0
            local shown_bytes=0
            local omitted_lines=0
            local status=0

            if diff -qr "$base_dir" "$head_dir" >"$listing_file"; then
              {
                echo "### ${label}"
                echo
                echo "0 differing files."
                echo
                echo "No generated-output changes."
                echo
              } >>"$GITHUB_STEP_SUMMARY"
              return
            else
              status=$?
            fi

            if [ "$status" -gt 1 ]; then
              cat "$listing_file" >&2
              return "$status"
            fi

            differing_files=$(awk 'END { print NR }' "$listing_file")
            if [ "$differing_files" -eq 1 ]; then
              file_word="file"
            fi

            if diff -r "$base_dir" "$head_dir" >"$diff_file"; then
              echo "Expected a detailed diff after finding differing files." >&2
              return 1
            else
              status=$?
            fi

            if [ "$status" -gt 1 ]; then
              cat "$diff_file" >&2
              return "$status"
            fi

            awk -v budget="$DIFF_BODY_BYTE_BUDGET" -v counts_file="$counts_file" '
              {
                total_lines += 1
                line_bytes = length($0) + 1
                if (!truncated && shown_bytes + line_bytes <= budget) {
                  print
                  shown_lines += 1
                  shown_bytes += line_bytes
                } else {
                  truncated = 1
                }
              }
              END {
                printf "%d %d %d\n", total_lines, shown_lines, shown_bytes > counts_file
              }
            ' "$diff_file" >"$body_file"
            read -r total_lines shown_lines shown_bytes <"$counts_file"
            omitted_lines=$((total_lines - shown_lines))

            {
              echo "### ${label}"
              echo
              echo "${differing_files} differing ${file_word}."
              echo
              if [ "$omitted_lines" -gt 0 ]; then
                echo "Diff body is truncated to ${shown_bytes} bytes of the ${DIFF_BODY_BYTE_BUDGET}-byte per-section budget; ${shown_lines} of ${total_lines} lines shown and ${omitted_lines} lines omitted."
              else
                echo "All ${total_lines} diff lines shown within the ${DIFF_BODY_BYTE_BUDGET}-byte per-section budget."
              fi
              if [ "$shown_lines" -gt 0 ]; then
                echo
                echo '```diff'
                cat "$body_file"
                echo '```'
              fi
              echo
            } >>"$GITHUB_STEP_SUMMARY"
          }

          {
            echo "## Generated output report"
            echo
            if [ "$CAPTURE_TOOLING_CHANGED" = "true" ]; then
              echo "## ⚠️ Capture tooling changed in this pull request"
              echo
              echo "The capture scripts differ between base and head. The generation differences below may reflect that tooling change rather than an engine change."
              echo
              echo "Changed capture scripts:"
              while IFS= read -r capture_script; do
                echo "- \`${capture_script}\`"
              done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- tools/capture_legal_actions.py tools/capture_turn_steps.py)
              echo
            fi
            echo "Comparing \`$BASE_SHA\` to \`$HEAD_SHA\`."
            echo
            echo "Each diff body is capped at ${DIFF_BODY_BYTE_BUDGET} bytes so this report stays below GitHub's 1 MiB summary limit."
            echo
          } >>"$GITHUB_STEP_SUMMARY"

          report_diff "Legal actions" "$BASE_DIR/actions" "$HEAD_DIR/actions"
          report_diff "Turn steps" "$BASE_DIR/turn-steps" "$HEAD_DIR/turn-steps"

          echo "Captured and compared in $(( $(date +%s) - started ))s." >>"$GITHUB_STEP_SUMMARY"
