name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.what.outputs.engine }}
      ui: ${{ steps.what.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: what
        name: Decide which lanes this change needs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request runs everything. A push to main is the last line
          # of defence and is not the place to be clever, and workflow_dispatch is someone asking
          # for a full run by hand.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "engine=true" >>"$GITHUB_OUTPUT"
            echo "ui=true" >>"$GITHUB_OUTPUT"
            echo "not a pull request: running every lane"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          # The engine lanes are needed unless EVERY changed path is design-only. Framed as
          # "nothing outside these directories" rather than "something inside them", so a new
          # top-level directory is treated as engine work until someone decides otherwise --
          # the failure that costs fifteen minutes is cheaper than the one that ships a bug.
          if echo "$changed" | grep -qvE '^(ui/|docs/)'; then
            echo "engine=true" >>"$GITHUB_OUTPUT"
          else
            echo "engine=false" >>"$GITHUB_OUTPUT"
            echo "design-only change: skipping the engine lanes"
          fi
          if echo "$changed" | grep -qE '^ui/'; then
            echo "ui=true" >>"$GITHUB_OUTPUT"
          else
            echo "ui=false" >>"$GITHUB_OUTPUT"
          fi

  ui:
    # What the engine lanes never checked: that the generators still produce their pages, and
    # that every asset still has a licence on record. Both are seconds, and until now nothing in
    # CI ran them at all.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.ui == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.ui == 'true'
        with:
          python-version: "3.13"
      - name: Install what the UI checks need
        if: needs.changes.outputs.ui == 'true'
        run: pip install -e ".[dev]" pillow numpy
      - name: Every generated page still rebuilds, and none is a fossil
        if: needs.changes.outputs.ui == 'true'
        run: python ui/rebuild_ui_pages.py --check
      - name: Every asset matches its declared box and has a licence on record
        if: needs.changes.outputs.ui == 'true'
        working-directory: ui/assets
        run: |
          python verify_assets.py
          python gen_credits.py --check

  fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.engine == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Deliberately F-only: undefined/shadowed names must gate, while existing E501s do not.
      # This one runs on EVERY change, design-only included: it is repo-wide, it takes seconds,
      # and it is exactly what caught fourteen undefined-name errors in ui/ the day that tree
      # arrived. Skipping it for design changes would skip it on the least-linted code there is.
      - run: ruff check --select F
      - name: Require Node.js for turn-script harness tests
        if: needs.changes.outputs.engine == 'true'
        run: |
          if ! command -v node >/dev/null; then
            echo "::error::Node.js is required for the turn-script harness tests."
            exit 1
          fi
          node --version
      - if: needs.changes.outputs.engine == 'true'
        run: pytest -m "not slow" --ignore=tests/test_play_view_clicks.py

  slow:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.engine == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.engine == 'true'
        with:
          python-version: "3.13"
      - if: needs.changes.outputs.engine == 'true'
        run: pip install -e ".[dev]"
      - name: Run deep-fixture slow guards
        if: needs.changes.outputs.engine == 'true'
        run: pytest -m slow -p no:cacheprovider --ignore=tests/test_play_view_clicks.py

  browser:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.engine == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.engine == 'true'
        with:
          python-version: "3.13"
      - if: needs.changes.outputs.engine == 'true'
        run: pip install -e ".[dev]"
      - name: Use the canonical Ubuntu mirror
        if: needs.changes.outputs.engine == 'true'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
      - uses: actions/cache@v4
        if: needs.changes.outputs.engine == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - if: needs.changes.outputs.engine == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run browser click guards
        if: needs.changes.outputs.engine == 'true'
        run: pytest -q -p no:cacheprovider tests/test_play_view_clicks.py

  generation-report:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package for generation captures
        run: pip install -e .
      - name: Detect capture-tooling changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            tools/capture_legal_actions.py tools/capture_turn_steps.py; then
            echo "CAPTURE_TOOLING_CHANGED=false" >>"$GITHUB_ENV"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo "CAPTURE_TOOLING_CHANGED=true" >>"$GITHUB_ENV"
          fi
      - name: Capture base generation
        env:
          REVISION: ${{ github.event.pull_request.base.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/generation-base
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/generation-report-start"
          git checkout --detach "$REVISION"
          python tools/capture_legal_actions.py "$OUTPUT_DIR/actions"
          python tools/capture_turn_steps.py "$OUTPUT_DIR/turn-steps"
      - name: Capture head generation
        env:
          REVISION: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/generation-head
        run: |
          set -euo pipefail
          git checkout --detach "$REVISION"
          python tools/capture_legal_actions.py "$OUTPUT_DIR/actions"
          python tools/capture_turn_steps.py "$OUTPUT_DIR/turn-steps"
      - name: Report generated-output changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_DIR: ${{ runner.temp }}/generation-base
          HEAD_DIR: ${{ runner.temp }}/generation-head
        run: |
          set -euo pipefail
          started=$(cat "$RUNNER_TEMP/generation-report-start")
          export LC_ALL=C
          DIFF_BODY_BYTE_BUDGET=400000

          report_diff() {
            local label="$1"
            local base_dir="$2"
            local head_dir="$3"
            local diff_file="$RUNNER_TEMP/${label}.diff"
            local listing_file="$RUNNER_TEMP/${label}.files"
            local body_file="$RUNNER_TEMP/${label}.body"
            local counts_file="$RUNNER_TEMP/${label}.counts"
            local differing_files=0
            local file_word="files"
            local total_lines=0
            local shown_lines=0
            local shown_bytes=0
            local omitted_lines=0
            local status=0

            if diff -qr "$base_dir" "$head_dir" >"$listing_file"; then
              {
                echo "### ${label}"
                echo
                echo "0 differing files."
                echo
                echo "No generated-output changes."
                echo
              } >>"$GITHUB_STEP_SUMMARY"
              return
            else
              status=$?
            fi

            if [ "$status" -gt 1 ]; then
              cat "$listing_file" >&2
              return "$status"
            fi

            differing_files=$(awk 'END { print NR }' "$listing_file")
            if [ "$differing_files" -eq 1 ]; then
              file_word="file"
            fi

            if diff -r "$base_dir" "$head_dir" >"$diff_file"; then
              echo "Expected a detailed diff after finding differing files." >&2
              return 1
            else
              status=$?
            fi

            if [ "$status" -gt 1 ]; then
              cat "$diff_file" >&2
              return "$status"
            fi

            awk -v budget="$DIFF_BODY_BYTE_BUDGET" -v counts_file="$counts_file" '
              {
                total_lines += 1
                line_bytes = length($0) + 1
                if (!truncated && shown_bytes + line_bytes <= budget) {
                  print
                  shown_lines += 1
                  shown_bytes += line_bytes
                } else {
                  truncated = 1
                }
              }
              END {
                printf "%d %d %d\n", total_lines, shown_lines, shown_bytes > counts_file
              }
            ' "$diff_file" >"$body_file"
            read -r total_lines shown_lines shown_bytes <"$counts_file"
            omitted_lines=$((total_lines - shown_lines))

            {
              echo "### ${label}"
              echo
              echo "${differing_files} differing ${file_word}."
              echo
              if [ "$omitted_lines" -gt 0 ]; then
                echo "Diff body is truncated to ${shown_bytes} bytes of the ${DIFF_BODY_BYTE_BUDGET}-byte per-section budget; ${shown_lines} of ${total_lines} lines shown and ${omitted_lines} lines omitted."
              else
                echo "All ${total_lines} diff lines shown within the ${DIFF_BODY_BYTE_BUDGET}-byte per-section budget."
              fi
              if [ "$shown_lines" -gt 0 ]; then
                echo
                echo '```diff'
                cat "$body_file"
                echo '```'
              fi
              echo
            } >>"$GITHUB_STEP_SUMMARY"
          }

          {
            echo "## Generated output report"
            echo
            if [ "$CAPTURE_TOOLING_CHANGED" = "true" ]; then
              echo "## ⚠️ Capture tooling changed in this pull request"
              echo
              echo "The capture scripts differ between base and head. The generation differences below may reflect that tooling change rather than an engine change."
              echo
              echo "Changed capture scripts:"
              while IFS= read -r capture_script; do
                echo "- \`${capture_script}\`"
              done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- tools/capture_legal_actions.py tools/capture_turn_steps.py)
              echo
            fi
            echo "Comparing \`$BASE_SHA\` to \`$HEAD_SHA\`."
            echo
            echo "Each diff body is capped at ${DIFF_BODY_BYTE_BUDGET} bytes so this report stays below GitHub's 1 MiB summary limit."
            echo
          } >>"$GITHUB_STEP_SUMMARY"

          report_diff "Legal actions" "$BASE_DIR/actions" "$HEAD_DIR/actions"
          report_diff "Turn steps" "$BASE_DIR/turn-steps" "$HEAD_DIR/turn-steps"

          echo "Captured and compared in $(( $(date +%s) - started ))s." >>"$GITHUB_STEP_SUMMARY"
